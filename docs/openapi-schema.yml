openapi: 3.0.3
info:
  title: Document QA RAG API
  version: 1.0.0
  description: REST API for DOCX document management, semantic retrieval, and document-grounded
    question answering.
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: Check whether the API is running and the PostgreSQL database is
        reachable.
      summary: Check API health
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
  /api/v1/documents/:
    get:
      operationId: v1_documents_list
      description: Return all uploaded documents. The list response omits full extracted
        text.
      summary: List documents
      tags:
      - Documents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentList'
          description: ''
    post:
      operationId: v1_documents_create
      description: Upload a DOCX document. The document is automatically processed,
        chunked, embedded, and indexed.
      summary: Upload and index a DOCX document
      tags:
      - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentDetailRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
  /api/v1/documents/{id}/:
    get:
      operationId: v1_documents_retrieve
      description: Return one document including its full extracted text.
      summary: Retrieve a document
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Document.
        required: true
      tags:
      - Documents
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
    put:
      operationId: v1_documents_update
      description: Update a document. Replacing the uploaded file runs the complete
        processing and indexing pipeline again.
      summary: Replace a document
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Document.
        required: true
      tags:
      - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentDetailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
    patch:
      operationId: v1_documents_partial_update
      description: Update selected document fields. A title-only update does not rebuild
        embeddings. Replacing the file does.
      summary: Partially update a document
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Document.
        required: true
      tags:
      - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDocumentDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDocumentDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDocumentDetailRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
    delete:
      operationId: v1_documents_destroy
      description: Delete the document and its related chunks.
      summary: Delete a document
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Document.
        required: true
      tags:
      - Documents
      security:
      - {}
      responses:
        '204':
          description: No response body.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
  /api/v1/questions/:
    get:
      operationId: v1_questions_list
      description: Return paginated saved question-answer history in reverse chronological
        order.
      summary: List question-answer history
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Question History
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuestionAnswerListList'
          description: ''
  /api/v1/questions/{id}/:
    get:
      operationId: v1_questions_retrieve
      description: Return one persisted question-answer item including its source
        snapshots.
      summary: Retrieve a saved answer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Question History
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionAnswerDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
  /api/v1/questions/ask/:
    post:
      operationId: v1_questions_ask_create
      description: Retrieve relevant chunks from indexed documents, generate a grounded
        answer, persist the result, and return the answer with its source snapshots.
      summary: Ask a document-grounded question
      tags:
      - Question Answering
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskQuestionRequest'
            examples:
              QuestionUsingSelectedDocuments:
                value:
                  question: When does course registration open?
                  document_ids:
                  - 1
                  top_k: 3
                  min_similarity: 0.2
                summary: Question using selected documents
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskQuestionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskQuestionRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionAnswerDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
components:
  schemas:
    APIError:
      type: object
      description: Standard API error response envelope.
      properties:
        error:
          $ref: '#/components/schemas/APIErrorBody'
      required:
      - error
    APIErrorBody:
      type: object
      description: Standard error body returned by the REST API.
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
      required:
      - code
      - message
    AskQuestionRequest:
      type: object
      description: Validate input for the document question answering API.
      properties:
        question:
          type: string
          minLength: 1
          description: Question to answer using indexed document content.
        document_ids:
          type: array
          items:
            type: integer
            minimum: 1
          nullable: true
          description: Optional indexed document IDs. Omit, use null, or use an empty
            list to search all indexed documents.
        top_k:
          type: integer
          maximum: 10
          minimum: 1
          default: 5
          description: Maximum number of retrieved chunks.
        min_similarity:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          default: 0.2
          description: Minimum cosine similarity required for a retrieved chunk.
      required:
      - question
    DocumentDetail:
      type: object
      description: Full serializer used for create, retrieve, and update.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        file:
          type: string
          format: uri
          pattern: (?:docx)$
        original_filename:
          type: string
          readOnly: true
        text_content:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        processing_error:
          type: string
          readOnly: true
        chunk_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chunk_count
      - created_at
      - file
      - id
      - original_filename
      - processing_error
      - status
      - text_content
      - title
      - updated_at
    DocumentDetailRequest:
      type: object
      description: Full serializer used for create, retrieve, and update.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        file:
          type: string
          format: binary
          pattern: (?:docx)$
      required:
      - file
      - title
    DocumentList:
      type: object
      description: Compact serializer used for document lists.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        file:
          type: string
          format: uri
          pattern: (?:docx)$
        original_filename:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        processing_error:
          type: string
          readOnly: true
        chunk_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chunk_count
      - created_at
      - file
      - id
      - original_filename
      - processing_error
      - status
      - title
      - updated_at
    HealthCheck:
      type: object
      description: Health check response.
      properties:
        status:
          type: string
        database:
          type: string
        version:
          type: string
      required:
      - database
      - status
      - version
    PaginatedQuestionAnswerListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/QuestionAnswerList'
    PatchedDocumentDetailRequest:
      type: object
      description: Full serializer used for create, retrieve, and update.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        file:
          type: string
          format: binary
          pattern: (?:docx)$
    QuestionAnswerDetail:
      type: object
      description: Complete history serializer including source snapshots.
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: string
          readOnly: true
        answer:
          type: string
          readOnly: true
        top_k:
          type: integer
          readOnly: true
        min_similarity:
          type: number
          format: double
          readOnly: true
        document_ids:
          readOnly: true
          nullable: true
        sources:
          type: array
          items:
            $ref: '#/components/schemas/QuestionAnswerSource'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer
      - created_at
      - document_ids
      - id
      - min_similarity
      - question
      - sources
      - top_k
    QuestionAnswerList:
      type: object
      description: Compact serializer for question-answer history lists.
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: string
          readOnly: true
        answer:
          type: string
          readOnly: true
        top_k:
          type: integer
          readOnly: true
        min_similarity:
          type: number
          format: double
          readOnly: true
        document_ids:
          readOnly: true
          nullable: true
        source_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer
      - created_at
      - document_ids
      - id
      - min_similarity
      - question
      - source_count
      - top_k
    QuestionAnswerSource:
      type: object
      description: Source snapshot returned with a question answer.
      properties:
        id:
          type: integer
          readOnly: true
        chunk_id:
          type: integer
          readOnly: true
          nullable: true
        document_id_snapshot:
          type: integer
          readOnly: true
        document_title:
          type: string
          readOnly: true
        chunk_index:
          type: integer
          readOnly: true
        similarity:
          type: number
          format: double
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chunk_id
      - chunk_index
      - created_at
      - document_id_snapshot
      - document_title
      - id
      - similarity
    StatusEnum:
      enum:
      - uploaded
      - processing
      - processed
      - indexed
      - failed
      type: string
      description: |-
        * `uploaded` - Uploaded
        * `processing` - Processing
        * `processed` - Processed
        * `indexed` - Indexed
        * `failed` - Failed
